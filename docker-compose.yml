version: '3.8'

services:
  backend:
    build:
      context: .        # Build from project root so backend/ is a proper package
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models       # Mount trained model
      - ./rag:/app/rag             # Mount RAG knowledge base
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules          # Prevent host node_modules from overriding container's

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
